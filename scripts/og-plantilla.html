<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      __FUENTES__
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; background: #000000; padding: 48px;
        font-family: "Inter Variable", system-ui, sans-serif; color: #FAFAFA;
      }
      .tarjeta {
        height: 100%; border-radius: 24px; background: #272917; padding: 56px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .marca { font-size: 28px; color: #999999; }
      .titulo { font-size: 40px; color: #999999; margin-bottom: 16px; }
      .programa { font-size: 88px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; }
      .programa em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: #E9FF7B; }
      .pie { display: flex; justify-content: space-between; font-size: 26px; color: #999999; }
      .cta { color: #E9FF7B; }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <div class="marca">Diagnóstico 30X con JEV</div>
      <div>
        <div class="titulo">Mi ruta en 30X:</div>
        <div class="programa">__PROGRAMA__</div>
      </div>
      <div class="pie"><span>Prototipo para el Hackatón 30X · no oficial</span><span class="cta">Haz el tuyo</span></div>
    </div>
  </body>
</html>
